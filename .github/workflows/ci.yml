name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-build.lock
            requirements-runtime.lock
            requirements-dev.lock
      - name: Install locked dependencies and package
        run: |
          python -m pip install --disable-pip-version-check -r requirements-build.lock -r requirements-runtime.lock -r requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
      - name: Static quality
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
          mypy src/detection_platform
          python -m compileall -q src tests scripts
      - name: Unit, integration, and end-to-end tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -t . -v
      - name: Dataset, policy, and snapshot gates
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python scripts/safety_static_gate.py
          python scripts/quality_gate.py
          python scripts/verify_snapshot.py

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate Compose deployment
        run: docker compose -f compose.yaml config --quiet
      - name: Build runtime image
        run: docker build --tag detection-as-code-platform:ci .
      - name: Validate bundle inside constrained image
        run: >-
          docker run --rm --read-only --cap-drop=ALL
          --security-opt=no-new-privileges
          detection-as-code-platform:ci detection-platform validate
