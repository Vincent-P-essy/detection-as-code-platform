title: Sensitive payroll records read
id: sigma.payroll-sensitive-read
status: stable
description: Detects synthetic bulk access to payroll records in application audit telemetry.
author: Vincent Plessy
date: 2026-07-13
modified: 2026-07-13
tags:
  - attack.collection
  - attack.t1005
logsource:
