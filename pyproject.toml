[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "detection-as-code-platform"
version = "0.1.0"
description = "Measured validation, replay, and simulated promotion for Sigma, YARA, and Falco rules"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Vincent Plessy"}]
dependencies = [
  "PyYAML==6.0.2",
  "yara-python==4.5.4"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security"
]

[project.scripts]
detection-platform = "detection_platform.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
detection_platform = [
  "web/*.html",
  "web/*.css",
  "web/*.js",
  "bundle/manifests/*.yml",
  "bundle/rules/sigma/*.yml",
  "bundle/rules/falco/*.yml",
  "bundle/rules/yara/*.yar",
  "bundle/datasets/*.json",
  "bundle/datasets/*/*.json",
  "bundle/datasets/*/*.jsonl",
  "bundle/datasets/*/*.txt"
]

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
